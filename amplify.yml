# AWS Amplify Hosting — Next.js 14 App Router (SSR / WEB_COMPUTE)
# Do not set artifacts.baseDirectory to "out". Amplify Compute needs ".next".

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - |
          if [ -f package-lock.json ]; then
            npm ci --cache .npm --prefer-offline
          else
            npm install --cache .npm
          fi
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=4096"
        # Copy Amplify Console env vars into files Next.js reads at build time.
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .npm/**/*
